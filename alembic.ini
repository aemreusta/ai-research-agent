# Alembic is the single owner of the schema (architecture v0.6 §17). The Go dispatcher reads and
# writes rows but never migrates, so there is exactly one place a table can be created.
#
# The URL is not configured here: `migrations/env.py` derives it from DATABASE_URL so that the
# `migrate` container, local development and the tests cannot drift apart.
[alembic]
script_location = migrations
prepend_sys_path = agent/src
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
