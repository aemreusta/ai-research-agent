[project]
name = "apilex-research-agent"
version = "0.1.0"
description = "AI research agent — claim-ledger centric, deterministic output gate"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Design docs keep hand-written, intentionally compact Python snippets.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "ASYNC",    # async gotchas
    "S",        # bandit
    "RUF",
]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^dispatcher/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
