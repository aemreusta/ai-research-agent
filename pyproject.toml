# Workspace root. The application itself lives in `agent/` (see [tool.uv.workspace]); this file
# owns the shared tooling configuration.
[project]
name = "apilex-test-case"
version = "0.1.0"
description = "AI research agent - claim-ledger centric, deterministic output gate"
requires-python = ">=3.13,<3.14"
dependencies = ["research-agent"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["agent"]

[tool.uv.sources]
research-agent = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.16",
    "types-pyyaml>=6.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["agent/src", "agent/tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "ASYNC",    # async gotchas
    "S",        # bandit
    "RUF",
]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"agent/tests/**" = ["S", "B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "agent/src"
exclude = ["^dispatcher/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real PostgreSQL (TEST_DATABASE_URL); skipped otherwise",
]
