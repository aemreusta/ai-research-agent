name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U research"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://research:research@localhost:55432/research
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.9.0'
          enable-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: dispatcher/go.mod
          cache-dependency-path: dispatcher/go.sum
      - run: uv sync --locked
      - run: make lint
      # Python owns migrations. Go must run afterwards against the same schema.
      - run: uv run pytest -q
      - run: go test -race ./...
        working-directory: dispatcher
      - run: uv run python evals/run.py --output /tmp/evidence-baseline.json
