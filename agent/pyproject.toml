[project]
name = "research-agent"
version = "0.1.0"
description = "Research agent core: graph, claim ledger, output gate, providers"
requires-python = ">=3.13,<3.14"
# Dependencies are added phase by phase, as the module that needs them lands.
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "structlog>=25.1",
    # Persistence. One driver for the whole system: SQLAlchemy async, Alembic sync and the
    # LangGraph Postgres checkpointer all speak psycopg 3 (D36).
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.16",
    "psycopg[binary,pool]>=3.2",
    # Per-run provider keys are Fernet-encrypted before they touch the database (D18).
    "cryptography>=45.0",
    # Service layer: `api` (REST + SSE + static UI) and `agent_server` (execute/cancel/healthz).
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "httpx>=0.28",
    "tenacity>=9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[project.scripts]
research = "research_agent.cli:main"
