id: judge_contradictions
version: 1
# Must equal the hash of the output model in code (prompting/schemas.py); a test checks it.
output_schema_hash: f893d62bfab1518c
description: Classify rule-detected disagreements between findings.
instructions: |
  Pairs of findings below disagree on the same attribute of the same entity, according to a
  rule-based check. For each pair decide what kind of disagreement it is:
  - `true_conflict`: the sources genuinely contradict each other;
  - `different_time`: both can be true at different points in time (an amended date, a
    figure from different years);
  - `different_scope`: they measure different things (revenue vs. ARR, EU vs. global market,
    draft vs. final text);
  - `rounding`: the same value written with different precision.

  Set `preferred` only when the evidence clearly favours one side - typically a primary source
  (regulator, official text, the company itself) against a secondary one, or a later official
  amendment. Otherwise use "none". Write `summary` in the report language.
template: |
  Research question: {question}
  Report language: {language}

  Pairs:
  {pairs}
demos: []
